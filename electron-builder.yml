appId: com.dbsync.app
productName: DB Sync
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tools
    to: tools
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
