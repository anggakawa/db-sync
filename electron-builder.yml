appId: com.dbsync.app
productName: DB Sync
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tools
    to: tools
  - from: build/icons/app-icon.ico
    to: icons/app-icon.ico
win:
  icon: build/icons/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icons/app-icon.ico
  uninstallerIcon: build/icons/app-icon.ico
publish: null
